<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังสรุปข่าว & นวัตกรรมย้อนหลัง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-6 text-slate-800">
  <div class="max-w-2xl mx-auto">
    <header class="text-center mb-6">
      <div class="inline-flex items-center justify-center p-3 bg-blue-600 text-white rounded-2xl shadow-md mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">คลังสาระ & สรุปข่าวย้อนหลัง</h1>
      <p class="text-sm text-slate-500 mt-1">ฐานข้อมูลสื่อ นวัตกรรมการสอน และประเด็นรอบโลกเพื่อครูเพื่อศิษย์</p>
    </header>

    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-2"></div>
      <p class="text-sm text-slate-500">กำลังเชื่อมต่อฐานข้อมูล...</p>
    </div>

    <div id="items-container" class="space-y-4"></div>
  </div>

  <script>
    async function fetchHistory() {
      const container = document.getElementById('items-container');
      const loader = document.getElementById('loading');

      try {
        const res = await fetch('/api/get-history');
        const json = await res.json();
        loader.classList.add('hidden');

        if (!json.success || !json.data || json.data.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-8 rounded-2xl shadow-sm text-center border border-slate-200 text-slate-400">
              ยังไม่มีบันทึกข้อมูลในฐานข้อมูล (จะเริ่มแสดงผลหลังจากบอทยิงรอบถัดไป)
            </div>
          `;
          return;
        }

        container.innerHTML = json.data.map(item => {
          let bodyHtml = '';
          if (item.sections && Array.isArray(item.sections)) {
            bodyHtml = item.sections.map(sec => `
              <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line text-xs sm:text-sm text-slate-700 leading-relaxed mb-2">
                ${sec}
              </div>
            `).join('');
          } else {
            bodyHtml = `<div class="whitespace-pre-line text-xs sm:text-sm text-slate-700 leading-relaxed">${item.rawContent || item.content || ''}</div>`;
          }

          return `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
                  ${item.date || 'ประจำวัน'}
                </span>
                <span class="text-xs text-slate-400">
                  ${item.createdAt ? new Date(item.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : ''}
                </span>
              </div>
              <h2 class="text-base font-bold text-slate-800 mb-3">${item.title || 'สรุปประจำวัน'}</h2>
              <div>${bodyHtml}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        loader.innerHTML = `
          <div class="bg-red-50 p-4 rounded-xl border border-red-200 text-red-600 text-sm">
            เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}
          </div>
        `;
      }
    }

    fetchHistory();
  </script>
</body>
</html>
